# =====================================================================
# 离线二进制分析域语义词表（binary_re）
#
# 分类器仍然按"动作后果"归类，而不是按接口名。离线域的动作面有两类：
#   1) 情报查询（HTTP，GET 为主）→ 主要是 F 类读；上报/提交新样本 → E 类
#   2) 对产物的处理（命令行侧，由 command.go 判定）→ 破坏性命令归 A/B
# 词表比在线域窄：离线分析不需要"接口测试词"，只需要能识别出
# "上传/提交样本" 与 "破坏性文件操作" 这两类动作。
# =====================================================================

normalize:
  lowercase: true
  strip_separators: "_-"
  split_camel: true
  decode_url_encoding: true
  parse_body: [json, form, multipart]

rest_method_class:
  GET: F
  HEAD: F
  OPTIONS: F
  DELETE: A
  PUT: B
  PATCH: B
  POST: unknown
  TRACE: deny

# ---------------------------------------------------------------------
# A. 删除 / 清空 / 销毁 —— 对产物与证据是红线（样本只能复制，不能改写）
# ---------------------------------------------------------------------
A:
  file_destroy:
    - truncate
    - shred
    - wipe
    - zero
    - erase
    - unlink
    - rmdir
    - purge
  batch_or_table:
    - deleteall
    - removeall
    - cleanup
    - drop
  invalidate_terminate:
    - kill
    - invalidate
  zh:
    - 删除
    - 清空
    - 销毁
  pinyin:
    - shanchu
    - qingkong

# ---------------------------------------------------------------------
# B. 覆盖 / 改写 —— 禁止：样本与报告保持原样，改写即破坏证据
# ---------------------------------------------------------------------
B:
  field_overwrite:
    - overwrite
    - patch
    - replace
    - rewrite
    - rewritebytes
    - reprocess
  reset_rollback:
    - reset
    - restore
    - rollback
    - revert
  migrate_ownership:
    - move
    - transfer
    - import
    - sync
  zh:
    - 覆盖
    - 重置
    - 回滚
  pinyin:
    - fugai
    - chongzhi

# ---------------------------------------------------------------------
# C. 受限修改：改名/注释/打标签属于分析过程，允许但需留痕
# ---------------------------------------------------------------------
C:
  metadata_note:
    - rename
    - annotate
    - comment
    - tag
    - label
    - note
    - bookmark
  zh:
    - 重命名
    - 注释
    - 标记

# ---------------------------------------------------------------------
# D. 状态迁移：把样本"投入分析/送检"这类动作，需显式授权
# ---------------------------------------------------------------------
D:
  submit_for_analysis:
    - submit
    - upload
    - send
    - report
    - detonate
    - sandbox
  zh:
    - 上传
    - 提交
    - 送检
  pinyin:
    - shangchuan
    - tijiao

# ---------------------------------------------------------------------
# E. 新建：生成报告/建分析项目，用占位内容
# ---------------------------------------------------------------------
E:
  create_analysis:
    - create
    - new
    - init
    - start
    - generate
  zh:
    - 新建
    - 创建

# ---------------------------------------------------------------------
# F. 读取/查询：情报查询、反编译、字符串提取等只读动作
# ---------------------------------------------------------------------
F:
  query:
    - get
    - search
    - query
    - lookup
    - list
    - read
    - view
    - download
    - export
  analysis:
    - decompile
    - disassemble
    - strings
    - imports
    - exports
    - sections
    - xrefs
    - functions
    - analyze
  zh:
    - 查询
    - 反编译
    - 反汇编
    - 提取

# ---------------------------------------------------------------------
# 参数开关 / 方法伪装（复用在线域规则：换皮不改变动作后果）
# ---------------------------------------------------------------------
param_switches:
  method_override: [_method, _method_override, x-http-method-override]
  action_keys: [action, op, do, cmd, operate, method, type, mode, flag]
  destructive_values: [delete, del, rm, remove, purge, clear, wipe, truncate, drop, reset]
  overwrite_values: [overwrite, replace, reset, force, is_cover, cover, merge, sync, assign]
  batch_patterns:
    - "*all"
    - "batch*"
    - "*byids"

# ---------------------------------------------------------------------
# 命令执行允许集（webshell/远程取证场景沿用在线域约定；离线域基本用不到）
# ---------------------------------------------------------------------
rce_exec_allowlist:
  - whoami
  - id
  - uname
  - hostname
rce_exec_denylist:
  - cat
  - less
  - more
  - head
  - tail
  - grep
  - env
  - printenv
  - curl
  - wget
  - nc
  - ncat
  - socat
  - base64
  - chmod
  - chown
  - crontab
  - systemctl
