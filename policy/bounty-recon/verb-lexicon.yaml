# =====================================================================
# 接口语义词表 · 在线侦察域（bounty_recon）
#
# 与 web_pentest 的差别只在 F 类：把"枚举/发现/爬取/收割"等只读侦察动作
# 明确归入允许类（否则 "subdomain enumeration" 这类路径会被判 unknown → 拒）。
# A/B/C/D/E 原样保留：侦察一旦碰到写动作，仍按在线测试的严格度处理。
#
# 用法：命中任一词 → 归入对应 class；词表外的动词按业务后果归入最近类别，
#      归不进 → unknown → 按禁止处理（规范 4.1 / 第九章）。
# 匹配面：method + path segments + query key/value + body key/value + headers，
#      全部小写化、去分隔符后再匹配（delete_user / userDelete / del-user / DELUSER 等价）。
# =====================================================================

normalize:
  lowercase: true
  strip_separators: "_-"        # delete_user → deleteuser
  split_camel: true             # userDelete → user delete
  decode_url_encoding: true
  parse_body: [json, form, multipart]

# ---------------------------------------------------------------------
# REST 方法默认语义
# ---------------------------------------------------------------------
rest_method_class:
  GET: F
  HEAD: F
  OPTIONS: F
  DELETE: A
  PUT: B
  PATCH: B
  POST: unknown                 # 结合命名判定
  TRACE: deny

# ---------------------------------------------------------------------
# A. 删除 / 清空 / 销毁 —— 禁止测试（存在性用只读证据证明）
# ---------------------------------------------------------------------
A:
  single_delete:
    - delete
    - del
    - remove
    - rm
    - unlink
    - destroy
    - erase
    - discard
  batch_or_table:
    - truncate
    - drop
    - purge
    - batchdelete
    - deleteall
    - removeall
    - deletebyids
  clear_reset_container:
    - clear
    - empty
    - clean
    - cleanup
    - wipe
    - flush
    - prune
  recycle_or_deactivate_account:
    - recycle
    - trash
    - deregister
    - closeaccount
    - unregister
    - abolish
  invalidate_terminate:
    - kill
    - invalidate
    - expire
    - void
  zh:
    - 删除
    - 清空
    - 销毁
    - 作废
    - 销户
    - 注销
  pinyin:
    - shanchu
    - qingkong
    - zuofei

# ---------------------------------------------------------------------
# B. 覆盖 / 重置 / 迁移 / 合并 —— 禁止测试
# ---------------------------------------------------------------------
B:
  field_overwrite:
    - set
    - patch
    - replace
    - overwrite
    - change
    - swap
    - exchange
  reset_rollback:
    - reset
    - restore
    - revert
    - rollback
    - undo
    - init
    - initdata
    - rebuild
  migrate_ownership:
    - move
    - transfer
    - migrate
    - import
    - sync
    - assign
    - grant
    - revoke
  zh:
    - 覆盖
    - 重置
    - 回滚
    - 迁移
    - 合并
    - 改归属
  pinyin:
    - fugai
    - chongzhi
    - qianyi

# ---------------------------------------------------------------------
# C. 通用修改 —— 受限（仅自建测试账号互测、可逆字段、测后恢复）
# ---------------------------------------------------------------------
C:
  verbs:
    - update
    - modify
    - edit
    - alter
    - revise
    - adjust
    - rename
  conditions:
    scope: own_test_accounts_only
    reversible_fields_only: true
    forbid_fields: [status, balance, permission, role, quota]
    restore_after: true
    record_before_after: true

# ---------------------------------------------------------------------
# D. 状态流转 —— 受限（高危子类直接红线）
# ---------------------------------------------------------------------
D:
  business_state:
    - cancel
    - close
    - open
    - disable
    - enable
    - activate
    - freeze
    - lock
    - unlock
    - confirm
    - approve
    - reject
    - submit
  high_risk_redline:            # 命中即红线 5/7/9
    - pay
    - refund
    - withdraw
    - redeem
    - publish
  conditions:
    scope: own_test_accounts_only
    forbid_if_notifies_real_user: true

# ---------------------------------------------------------------------
# E. 新增 / 创建 —— 条件测试（测试账号 + 占位内容）
# ---------------------------------------------------------------------
E:
  create:
    - create
    - add
    - new
    - insert
    - save
    - append
    - generate
    - register
    - import
  upload:
    - upload
    - put
  apply_book_order:
    - apply
    - book
    - order
    - reserve
    - enroll
  send_notify:                  # 命中红线 5
    - send
    - push
    - notify
    - sms
    - mail
    - message
    - verify
  conditions:
    test_account_only: true
    placeholder_content: true
    cancel_immediately: true

# ---------------------------------------------------------------------
# F. 读取 / 查询 —— 正常测试（按第五章预算）
# ---------------------------------------------------------------------
F:
  verbs:
    - get
    - list
    - query
    - search
    - detail
    - info
    - view
    - export
    - download
    - login
    - logout
  recon:                        # 只读侦察动作：归 F 后仍受第五章预算与响应检查约束
    - enumerate
    - discovery
    - discover
    - crawl
    - scrape
    - harvest
    - collect
    - gather
    - subdomain
    - subdomains
    - javascript
    - endpoints
    - assets
  zh:
    - 枚举
    - 发现
    - 爬取
    - 抓取
    - 收割
    - 收集
    - 梳理
    - 测绘
    - 资产
    - 子域
  pinyin:
    - meiju
    - faxian
    - paqu
    - shouge
    - shouji
  export_budgeted: [export, download]

# ---------------------------------------------------------------------
# 参数开关 / 方法伪装 / 批量形态（4.1 换皮等价）
# ---------------------------------------------------------------------
param_switches:
  method_override: [_method, _method_override, x-http-method-override]
  action_keys: [action, op, do, cmd, operate, method, type, mode, flag]
  destructive_values: [delete, del, rm, remove, purge, clear, wipe, truncate, drop, reset, restore, hard_delete]
  overwrite_values: [overwrite, replace, reset, force, is_cover, cover, merge, sync, assign]
  batch_patterns:
    - "*all"
    - "batch*"
    - "*byids"
    - "deleteby*"
    - "truncate*"

# ---------------------------------------------------------------------
# 命令执行 / webshell 取证允许集（6.4）
# ---------------------------------------------------------------------
rce_exec_allowlist:
  - whoami
  - id
  - uname
  - hostname
  - ifconfig
  - ipconfig
rce_exec_denylist:
  - cat
  - nl
  - less
  - more
  - head
  - tail
  - grep
  - env
  - printenv
  - curl
  - wget
  - nc
  - ncat
  - socat
  - base64
  - chmod
  - chown
  - crontab
  - systemctl
  - net
  - reg
  - schtasks
  - certutil
  - powershell
  - python
  - sh
  - bash
  - tar
  - zip
