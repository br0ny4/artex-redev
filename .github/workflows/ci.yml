name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 连接串指向 CI 里的临时 PG；db.Open 会在缺库时自建。
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: 构建
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      # 上游代码本身不是 gofmt 干净的（保持原样便于对照）；本仓库新增的
      # 规范执行层必须是干净的，否则评审噪音会掩盖真实改动。
      - name: gofmt（新增代码）
        run: |
          set -e
          files="$(gofmt -l policy traffic/policy.go traffic/policy_test.go guard server/login_limiter.go server/policy_audit.go server/policy_api.go db/policy_audit.go db/policy_audit_test.go)"
          if [ -n "$files" ]; then
            echo "以下文件需要 gofmt -w："
            echo "$files"
            exit 1
          fi

      - name: 单元测试（含 PostgreSQL 集成）
        run: go test ./... -count=1 -timeout 10m

      - name: 策略层回归（规范执行层）
        run: go test ./policy/ ./guard/ ./traffic/ -count=1 -v 2>&1 | tail -40
