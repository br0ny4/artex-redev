# 远程镜像不可用时的本地 compose：不再 pull autumn27/artex，改为就地 build。
#
#   cp .env.example .env      # 填 POSTGRES_PASSWORD
#   docker compose -f docker-compose.local.yml up -d --build
#   # → http://localhost:8787
#
# 与 docker-compose.yml 的差异只有 artex 服务：把 image: 换成 build:，并给个本地 tag。
# postgres 仍然是官方 postgres:16-alpine（这个镜像是公开通用镜像，与项目无关，
# 删不掉；拉不动就换镜像站前缀，见 deploy 文档）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        # 版本号：留 dev 会禁用页面「一键更新」（防止本地构建被正式版覆盖）。
        # 想启用更新就填三段式，如 0.3.7。
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        SKIP_PLAYWRIGHT: ${SKIP_PLAYWRIGHT:-0}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-python:3.12-slim-bookworm}
    image: ${ARTEX_IMAGE:-artex:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
